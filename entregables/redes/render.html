<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@700;800&family=Public+Sans:wght@400;500;600&display=swap">
<style>
@page { size: 1080px 1350px; margin: 0; }
*{box-sizing:border-box} body{margin:0}
.post{width:1080px;height:1350px;position:relative;overflow:hidden;padding:96px 88px 88px;display:flex;flex-direction:column;page-break-after:always;break-after:page}
.etq{align-self:flex-start;font:600 28px/1 'Public Sans',Arial,sans-serif;letter-spacing:.02em;padding:16px 28px;border-radius:999px}
.tit{font:800 104px/0.98 'Albert Sans',Arial,sans-serif;letter-spacing:-0.035em;margin-top:56px;max-width:904px;text-wrap:balance}
.apoyo{font:400 40px/1.4 'Public Sans',Arial,sans-serif;margin-top:36px;max-width:640px}
.cifra{font:800 520px/.82 'Albert Sans',Arial,sans-serif;letter-spacing:-0.05em;margin-top:40px}
.cifra + .tit{margin-top:8px}
.cta{align-self:flex-start;margin-top:44px;font:600 32px/1 'Public Sans',Arial,sans-serif;padding:24px 44px;border-radius:999px}
.pie{margin-top:auto}
.masc{position:absolute;right:96px;bottom:92px;width:330px}
.masc svg{width:100%;height:auto}
.P{background:#0A2B2C;color:#fff}.P .apoyo{color:#BCD0CB}.P .etq{background:#157A6E;color:#fff}.P .cta{background:#FF8A3D;color:#0A2B2C}
.C{background:#F3F4EE;color:#0A2B2C}.B{background:#fff;color:#0A2B2C}
.C .apoyo,.B .apoyo{color:#4D5E5C}
.e-consejos,.e-ordenar{background:#E3F0EC;color:#0A2B2C}
</style></head><body>
<section class="post P" id="p1"><span class="etq">Crece sin complicarte</span><div class="tit">Empieza cobrando hoy.</div><p class="apoyo">Lo demás lo agregas cuando quieras.</p><span class="cta">Prueba gratis 14 días</span><div class="pie" data-logo="negativo" data-size="46"></div><div class="masc" data-mascota="nuvi" data-pose="wave" data-face="smile" data-size="330"></div></section>
<section class="post C" id="p2"><span class="etq e-consejos">Dato</span><div class="cifra">3</div><div class="tit">toques para cobrar.</div><p class="apoyo">Busca, agrega, cobra.</p><div class="pie" data-logo="positivo" data-size="46"></div></section>
<section class="post B" id="p3"><span class="etq e-ordenar">Fase 2 · Ordenar</span><div class="tit">Te quedan 3 refrescos.</div><p class="apoyo">¿Pedimos más? Vora te avisa antes de que se acabe.</p><div class="pie" data-logo="positivo" data-size="46"></div><div class="masc" data-mascota="vora" data-pose="point" data-face="smile" data-size="330"></div></section>
<script src="../nuvora-kit.js"></script>
<script>document.querySelectorAll('.pie .logo svg').forEach(s=>{s.setAttribute('width',54);s.setAttribute('height',54)})</script>
</body></html>
